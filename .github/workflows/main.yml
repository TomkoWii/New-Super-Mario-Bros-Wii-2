```yaml
name: Build New Super Mario Bros Wii 2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wii libraries
        run: |
          if [ ! -d /opt/devkitpro/libogc ]; then
            for i in 1 2 3 4; do
              dkp-pacman -Sy --noconfirm wii-dev && break
              sleep 10
            done
          fi

      - name: Build game
        run: make

      - name: Package game
        run: |
          mkdir -p out/apps/nsmbwii2
          cp boot.dol meta.xml out/apps/nsmbwii2/

      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: nsmbwii2-dolphin-wii
          path: out
```
